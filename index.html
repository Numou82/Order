<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .invoice-container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 30px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Header Section */
    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    .company-details h2 {
      font-size: 22px;
      font-weight: bold;
      color: #000;
      margin-bottom: 6px;
    }

    .company-details p {
      font-size: 14px;
      color: #333;
      line-height: 1.4;
    }

    .meta-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-row label {
      font-size: 14px;
      font-weight: bold;
      color: #000;
      white-space: nowrap;
    }

    /* Full Border Input Styling */
    input[type="text"],
    input[type="date"],
    input[type="tel"] {
      border: 1px solid #767676;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="tel"]:focus {
      border-color: #000;
    }

    .invoice-no-input {
      color: #800000;
      font-weight: bold;
      width: 140px;
    }

    /* Customer Section */
    .customer-section {
      margin-top: 15px;
    }

    .customer-section h3 {
      font-size: 15px;
      font-weight: bold;
      color: #800000;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .customer-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 500px;
    }

    .customer-form .field-row {
      display: flex;
      justify-content: space-between;
    }

    .customer-form label {
      width: 130px;
    }

    .customer-form input {
      flex: 1;
    }

    /* Responsive adjustment */
    @media (max-width: 600px) {
      .header-section {
        flex-direction: column;
        gap: 20px;
      }
      .meta-details {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="invoice-container">
    
    <!-- Top Header & Invoice Meta -->
    <div class="header-section">
      <div class="company-details">
        <h2>Saif Centralac Air Conditioner</h2>
        <p>Jileeb Abbasiya, Block 1 Street 238</p>
        <p>Mob. 65704705</p>
      </div>

      <div class="meta-details">
        <div class="field-row">
          <label>DATE:</label>
          <input type="date" value="2026-09-02">
        </div>
        <div class="field-row">
          <label>Invoice NO.:</label>
          <input type="text" class="invoice-no-input" value="46241">
        </div>
      </div>
    </div>

    <!-- Customer Details Section -->
    <div class="customer-section">
      <h3>CUSTOMER DETAILS</h3>
      <div class="customer-form">
        <div class="field-row">
          <label>Customer Name:</label>
          <input type="text" placeholder="Enter Customer Name">
        </div>
        <div class="field-row">
          <label>Address:</label>
          <input type="text" placeholder="Enter Customer Address">
        </div>
        <div class="field-row">
          <label>Contact No:</label>
          <input type="tel" placeholder="Enter Mobile No">
        </div>
      </div>
    </div>

  </div>

</body>
</html>
