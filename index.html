<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invoice - Saif Centralac</title>
  <style>
    /* Strict 1-Page PDF Print Settings */
    @page {
      size: A4 portrait;
      margin: 12mm 15mm; /* Clean margins for print */
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      font-family: Arial, sans-serif;
      color: #000;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Container lock to prevent 2nd page spillover */
    .invoice-container {
      max-width: 800px;
      margin: 0 auto;
      box-sizing: border-box;
      page-break-inside: avoid;
    }

    /* 1. Header Box with Border */
    .header-box {
      border: 2px solid #000;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-text h1 {
      margin: 0 0 4px 0;
      font-size: 20px;
      font-weight: bold;
      color: #000;
    }

    .header-text p {
      margin: 2px 0;
      font-size: 13px;
    }

    .logo-container img {
      max-height: 75px;
      width: auto;
      display: block;
    }

    /* Details Section Grid */
    .details-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 15px;
    }

    /* 2. Customer Details Box with Border */
    .customer-box {
      border: 1.5px solid #000;
      padding: 10px 12px;
      flex: 1;
    }

    .customer-box h3 {
      margin: 0 0 6px 0;
      color: #800000;
      font-size: 13px;
      text-transform: uppercase;
    }

    .customer-box p {
      margin: 3px 0;
      font-size: 13px;
    }

    /* 3. Date & Invoice No Box with Border */
    .invoice-info-box {
      border: 1.5px solid #000;
      padding: 10px 12px;
      width: 210px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .invoice-info-box p {
      margin: 4px 0;
      font-size: 13px;
      font-weight: bold;
    }

    .invoice-no-highlight {
      color: #800000;
    }

    /* 4. Table Styling & Black Headers */
    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }

    .invoice-table th {
      color: #000;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
      padding: 8px;
      border: 1px solid #000;
      background-color: #f2f2f2;
    }

    .invoice-table td {
      border: 1px solid #000;
      padding: 8px;
      font-size: 13px;
    }

    /* Alignments */
    .text-left { text-align: left; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
  </style>
</head>
<body>

  <div class="invoice-container">
    
    <!-- Header Box -->
    <div class="header-box">
      <div class="header-text">
        <h1>Saif Centralac Air Conditioner</h1>
        <p>Jileeb Abbasiya, Block 1 Street 238</p>
        <p>Mob. 65704705</p>
      </div>
      <div class="logo-container">
        <img src="logo.png" alt="Saif Centralac Logo">
      </div>
    </div>

    <!-- Customer and Invoice Details -->
    <div class="details-row">
      <div class="customer-box">
        <h3>CUSTOMER DETAILS</h3>
        <p><strong>Customer Name:</strong> saif</p>
        <p><strong>Address:</strong> hawallyu</p>
        <p><strong>Contact No:</strong> 513</p>
      </div>

      <div class="invoice-info-box">
        <p>DATE: <span style="font-weight: normal;">09 / 02 / 2026</span></p>
        <p>Invoice NO.: <span class="invoice-no-highlight">46240</span></p>
      </div>
    </div>

    <!-- Items Table -->
    <table class="invoice-table">
      <thead>
        <tr>
          <th class="text-left" style="width: 55%;">DESCRIPTION</th>
          <th class="text-center" style="width: 10%;">QTY</th>
          <th class="text-center" style="width: 15%;">Per Unit</th>
          <th class="text-right" style="width: 20%;">TOTAL</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="text-left">wash whole machine</td>
          <td class="text-center">1</td>
          <td class="text-center">15</td>
          <td class="text-right">15.000</td>
        </tr>
      </tbody>
    </table>

  </div>

</body>
</html>
